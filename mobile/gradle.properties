org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official
kotlin.mpp.stability.nowarn=true
kotlin.native.disableCompilerDaemon=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin/Native requires linking against real Apple SDKs, which only exist on macOS. This
# environment has no Mac/Xcode, so the iosApp framework export target is configured (per Task 5's
# brief) but not built here -- silence the cross-compilation warning rather than fight it.
kotlin.native.ignoreDisabledTargets=true
