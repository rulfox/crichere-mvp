# XcodeGen spec (docs/PHASE9.md) -- generates the .xcodeproj this repo has never checked in (no
# Mac/Xcode here to hand-author or validate one -- see this directory's README.md). A human on a
# Mac runs `xcodegen generate` from this directory to get a real project; re-run it any time
# iosApp/*.swift files are added/removed, no manual "add file to target" step in Xcode needed.
name: iosApp

options:
  bundleIdPrefix: com.crichere
  deploymentTarget:
    iOS: "17.0" # the SwiftUI views use the two-param onChange(of:initial:_:), which is iOS 17+
                # (ProfileSetupView's PhotosPicker needs 16+, so 17 satisfies that too)

packages:
  # Pin an exact version by checking https://github.com/firebase/firebase-ios-sdk/releases at
  # build time -- same "check live sources, don't assume from training data" discipline this
  # repo's libs.versions.toml comments document for every other dependency. Placeholder version
  # below MUST be updated before `xcodegen generate` is run for real.
  FirebaseIOS:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"

targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iosApp
    # Info.plist is GENERATED from these properties on every `xcodegen generate` -- edit keys here,
    # never in iosApp/Info.plist (a hand edit there is overwritten; that once dropped the fonts,
    # the URL scheme and the location string, docs/IOS-REDESIGN-PLAN.md §2).
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Crichere
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # Portrait only (owner, 2026-11-07), on iPhone and iPad. An iPad app limited to some
        # orientations must opt out of multitasking, hence UIRequiresFullScreen.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        # Brand faces, same variable files as androidApp/res/font (iosApp/Fonts, copied to the
        # bundle root): Archivo headlines, Instrument Sans UI text, JetBrains Mono money/phone/OTP.
        UIAppFonts:
          - archivo_variable.ttf
          - instrument_sans_variable.ttf
          - jetbrains_mono_variable.ttf
        # Phase 3 deep link crichere://leagues/{id} (same as Android's intent-filter), handled by
        # iosAppApp.swift's onOpenURL.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [crichere]
        # League Dashboard "near me" and the "Use my location" pills prompt via
        # LocationPermission.swift; iOS requires this string before it can prompt at all.
        NSLocationWhenInUseUsageDescription: Crichere uses your location to show leagues and grounds near you.
        # No NSAppTransportSecurity exception: the app only talks to https://api.crichere.com
        # (docs/SECURITY-AUDIT.md, mobile).
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crichere.app
        # A human on a Mac fills in their own Apple Developer Team id here (or in Xcode's Signing
        # & Capabilities tab after generation) -- not something this environment has or should
        # fabricate.
        DEVELOPMENT_TEAM: ""
        SWIFT_VERSION: "5.0"
    dependencies:
      - package: FirebaseIOS
        product: FirebaseAuth
      - package: FirebaseIOS
        product: FirebaseCore
    preBuildScripts:
      - name: "Embed Shared.framework (Kotlin Multiplatform)"
        # Standard KMP Gradle task for linking a Compose-Multiplatform-free shared module's
        # exported framework (shared/build.gradle.kts's `binaries.framework { baseName = "Shared" }`)
        # into an Xcode target -- replaces this README's old manual "add a Run Script build phase"
        # instructions with a spec XcodeGen keeps in sync automatically. Xcode supplies
        # CONFIGURATION/SDK_NAME/ARCHS/BUILT_PRODUCTS_DIR etc. to this script automatically as
        # build-phase environment variables -- no manual passthrough needed.
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
