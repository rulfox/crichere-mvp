[versions]
# Chosen 2026-09-02/03 by checking live sources (Maven Central, kotlinlang.org, developer.android.com,
# insert-koin.io, skie.touchlab.co) rather than assuming from training data, per the precedent set in
# Task 1. See task-5-report.md for the full compatibility reasoning (Kotlin <-> AGP <-> Gradle tested
# ranges, Koin/SKIE Kotlin support windows).
kotlin = "2.3.21"
agp = "8.13.2"
composeMultiplatform = "1.10.0"
composeCompiler = "2.3.21"
ktor = "3.5.2"
koin = "4.2.2"
kotlinxSerialization = "1.11.0"
kotlinxCoroutines = "1.10.2"
skie = "0.10.14"
androidxLifecycle = "2.10.0"
androidxDatastore = "1.2.1"
androidxSecurityCrypto = "1.1.0"
tink = "1.19.0"
androidxActivityCompose = "1.11.0"
androidxCoreKtx = "1.17.0"
robolectric = "4.16"
kotlinxCoroutinesTest = "1.10.2"
junit4 = "4.13.2"
androidxTestCore = "1.7.0"
# Android instrumented UI tests (Compose UI Testing + Android Test Orchestrator), checked against
# live sources (developer.android.com/jetpack/androidx/releases/test) 2026-09-28, same precedent
# as every other version in this file.
androidxTestRunner = "1.7.0"
androidxTestRules = "1.7.0"
androidxTestExtJunit = "1.2.1"
androidxTestOrchestrator = "1.6.1"
# Firebase BOM + google-services plugin, checked against live sources (mvnrepository.com,
# firebase.google.com/support/release-notes/android) on 2026-09-03, same as Task 5's precedent.
# Note: `firebase-auth-ktx` (named in this task's brief) no longer exists as of BOM 34.0.0
# (July 2025) -- Google merged all KTX APIs into the main `firebase-auth` module and dropped the
# KTX artifacts from the BOM entirely. `firebase-auth` is the correct, current dependency; using
# the brief's literal artifact name would fail to resolve against this BOM version.
firebaseBom = "34.17.0"
googleServices = "4.4.4"
kotlinxCoroutinesPlayServices = "1.10.2"
# Ground location picker (Phase 2). Checked against live sources (mvnrepository.com,
# developers.google.com/android/guides/releases) on 2026-09-04, same precedent as the
# Firebase BOM above. No Maps API key exists in this environment -- see androidApp's
# build.gradle.kts for the same conditional-config pattern google-services.json already uses.
# mapsCompose pinned below 6.7.0 deliberately -- 8.4.0's transitive core-ktx 1.19.0 needs
# compileSdk 37 + AGP 9.1.0, which this project isn't on (see libs.versions.toml's agp comment).
# 6.4.1 exposes the identical GoogleMap/Marker/rememberCameraPositionState API this app uses.
playServicesMaps = "20.0.0"
mapsCompose = "6.4.1"
# Ground map search, Places autocomplete option (docs/PHASE2.md "Ground map search"). Checked on
# dl.google.com/android/maven2 2026-10-02: 6.0.2 pulls kotlin-stdlib 2.4.0 (this project is on
# 2.3.21), 5.3.0 pulls 2.3.0 -- so 5.3.0.
places = "5.3.0"
coil = "3.5.0"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-client-auth = { module = "io.ktor:ktor-client-auth", version.ref = "ktor" }

koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }

androidx-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }

androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidxDatastore" }
tink-android = { module = "com.google.crypto.tink:tink-android", version.ref = "tink" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCoreKtx" }

robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTestRules" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-orchestrator = { module = "androidx.test:orchestrator", version.ref = "androidxTestOrchestrator" }

firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { module = "com.google.firebase:firebase-auth" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "kotlinxCoroutinesPlayServices" }

play-services-maps = { module = "com.google.android.gms:play-services-maps", version.ref = "playServicesMaps" }
maps-compose = { module = "com.google.maps.android:maps-compose", version.ref = "mapsCompose" }
places = { module = "com.google.android.libraries.places:places", version.ref = "places" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
skie = { id = "co.touchlab.skie", version.ref = "skie" }
googleServices = { id = "com.google.gms.google-services", version.ref = "googleServices" }
