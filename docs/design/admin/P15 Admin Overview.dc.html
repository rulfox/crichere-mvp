<!DOCTYPE html>
<html>
<head>


<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&amp;family=Inter:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&amp;display=block" rel="stylesheet">
<script src="./p15-overview.js"></script>
</helmet>
<div id="p15root" style="width:max-content"></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{}'>
class Component extends DCLogic {
  componentDidMount() {
    const draw = () => {
      const root = document.getElementById('p15root');
      if (!window.P15 || !root) { setTimeout(draw, 50); return; }
      if (!document.getElementById('p15css')) {
        const st = document.createElement('style'); st.id = 'p15css'; st.textContent = window.P15.css; document.head.appendChild(st);
      }
      root.innerHTML = window.P15.body;
    };
    draw();
  }
  renderVals() { return {}; }
}
</script>
</body>
</html>
