<!DOCTYPE html>
<html>
<head>


<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&amp;family=Inter:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&amp;display=block" rel="stylesheet">
<script src="./admin-kit.js"></script>
<script src="./p16-overview.js"></script>
<script src="./p16-access.js"></script>
<script src="./p16-moderation.js"></script>
<script src="./p16-leagues.js"></script>
<script src="./p16-users.js"></script>
<script src="./p16-states.js"></script>
<style>
.input.ph{justify-content:flex-start;align-items:center}
.input.ph.area{align-items:flex-start}
.panel>div[style*="margin-top:-28px"]{margin-top:-32px !important;align-items:flex-end}
.panel>div[style*="margin-top:-28px"]>.col{padding-top:40px}
.btn.full{box-sizing:border-box}
.cols,.xax{max-width:100%;box-sizing:border-box}
.kpi.alert>.sub{margin-top:31px}
.menu .segctl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.menu .segctl>span{justify-content:center}
.app span.sub[style*="text-align:center"]{text-align:left !important}
.panel>.sub>.ic{font-size:16px;vertical-align:-3px;margin-right:2px}
#S1>.app,#S1d>.app,#S1w>.app,#S2>.app,#S3>.app,#S4>.app,#S5>.app{min-height:820px !important;height:820px !important}
.logo{background:url(assets/logo/crichere-mark.svg) center/88% no-repeat !important;color:transparent !important;border-radius:0 !important;width:30px;height:30px}
.dark .logo{background-image:url(assets/logo/crichere-mark-reverse.svg) !important}
.wm{font-weight:600 !important;text-transform:lowercase;letter-spacing:-.02em}
.wm small{text-transform:none}
.spanel .stop{right:96px !important}
</style>
</helmet>
<div id="p16root" style="padding:64px;display:flex;flex-direction:column;gap:64px;width:max-content"></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{}'>
class Component extends DCLogic {
  componentDidMount() {
    const draw = () => {
      const root = document.getElementById('p16root');
      if (!root || !window.AK || !window.P16 || window.P16.length < 6) { setTimeout(draw, 50); return; }
      if (!document.getElementById('akcss')) { const st = document.createElement('style'); st.id = 'akcss'; st.textContent = window.AK.css; document.head.insertBefore(st, document.head.firstChild); }
      const intro = '<div style="display:flex;flex-direction:column;gap:12px;max-width:960px"><span style="font:500 11px/1 IBM Plex Mono,monospace;letter-spacing:.12em;color:#5C645F">BATCH 16 · ADMIN WEB · DESKTOP 1440 + PHONE 390 · LIGHT AND DARK</span><p style="margin:0;font:400 15px/1.6 Inter,sans-serif;color:#434945">The owner\'s private admin site (docs/PHASE20.md), built on the direction picked from P15: 1a grid with 1b summaries, theme following the device. Sections: O Overview, S sign-in and account, M moderation, L leagues, U users, X states. Sample data is fictional. Built by admin-kit.js and the p16-*.js files; ask Claude to change a board rather than editing the generated markup.</p></div>';
      root.innerHTML = intro + window.P16.slice().sort((a, b) => a.o - b.o).map(p => { try { return p.build(); } catch (e) { return '<pre style="color:#B62E2E">' + p.o + ': ' + e.message + '</pre>'; } }).join('');
    };
    draw();
  }
  renderVals() { return {}; }
}
</script>
</body>
</html>
